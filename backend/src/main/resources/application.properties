spring.application.name=backend

# PostgreSQL connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/restaurant_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and database migrations
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# Razorpay credentials must be supplied through environment variables.
# Never commit API secrets to source control.
RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:}
RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:}
RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:}
